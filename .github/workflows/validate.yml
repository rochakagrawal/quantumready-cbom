name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate the example CBOM
        run: node validator/index.mjs examples/repository-scan.cbom.json
      - name: Test the validator
        run: node --test validator/test.mjs
